    note: 根 LIB-Q01（取り置き期限を延ばす試行をするか）の回2の答えには、通知が翌日以降だと期限切れ18%という『言えること』がある一方、通知日を揃えても金曜確保分は16%のままという『弱める証拠と留保』があり、『延長の試行をするかは、来館できる日の少なさを確かめるまで決められない』と未判別で締めている。根の進捗も未着手（分析設計を直接結んでいない）なので、claim
