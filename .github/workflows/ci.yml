name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  # No base-branch filter: run on every PR, including stacked Story->Epic PRs
  # (base = epic/*) and Epic->main PRs. Closes the gap where non-main-base PRs
  # were not CI-gated (ADR-0002).
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --all-extras

      - name: Lint
        run: uv run poe lint

      - name: Type check
        run: uv run poe typecheck

      - name: Test
        run: uv run poe test

  build-check:
    needs: [python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Verify wheel contents
        run: python scripts/verify_wheel.py

      - name: Check distribution metadata
        run: uvx --from twine twine check dist/*

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The runner image has no claude CLI. Track the "stable" dist-tag rather
      # than an exact version: nothing bumps an npm pin here, and validate needs
      # no auth.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@stable

      # "validate ." checks only marketplace.json; the plugin manifest path is
      # what also validates each skills/*/SKILL.md. No --strict: it fails on the
      # root CLAUDE.md warning, which is repo guidance, not plugin content.
      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate plugin manifest and skills
        run: claude plugin validate .claude-plugin/plugin.json
