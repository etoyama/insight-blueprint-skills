# Hooks without `stages` run on commit only. The pre-push hook runs the same check as CI.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: "ruff: format"
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
        exclude: "^\\.claude/"

      - id: ruff-check
        name: "ruff: lint"
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
        exclude: "^\\.claude/"

      - id: ty-check
        name: "ty: type check"
        entry: uv run ty check src/
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest --tb=short -q
        language: system
        pass_filenames: false
        always_run: false
        types: [python]

      # Why: a commit can skip hooks or land in a worktree without them; the push is the
      # last point before the epic branch is shared, so check everything there.
      - id: poe-all
        name: "poe all (lint + typecheck + test)"
        entry: uv run poe all
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
